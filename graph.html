<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive knowledge graph connecting writeups to tags, built client-side with D3.">
    <meta name="author" content="Your Name">
    <meta charset="UTF-8">

    <title>Graph | 0xnotes</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Theme restore: inline so it runs before Bootstrap CSS paints -->
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/graph.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
    <!-- D3 (powers the force-directed graph — all rendering happens in the browser) -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" defer></script>
    <!-- Custom JS -->
    <script src="js/theme.js"      defer></script>
    <script src="js/components.js" defer></script>
    <!-- writeups.js supplies the shared data (window.SITE_WRITEUPS); graph.js renders it -->
    <script src="js/writeups.js"   defer></script>
    <script src="js/graph.js"      defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <div id="navbar-placeholder"></div>

  <main id="main-content" class="flex-grow-1">
    <div class="container">

      <div id="graph-page-header">
        <h1 class="h3 fw-bold mb-1">Knowledge Graph</h1>
        <p class="text-muted mb-0">
          Every writeup connected to its tags. Drag nodes around, scroll to zoom,
          click a node to see its details, or search below.
        </p>
      </div>

      <div class="graph-shell py-4">

        <!-- Graph stage -->
        <div class="graph-stage">

          <div class="graph-toolbar">
            <input id="graph-search"
                   type="search"
                   class="form-control form-control-sm"
                   placeholder="Search titles or tags…"
                   aria-label="Search the knowledge graph">
            <button id="graph-reset" class="graph-btn" type="button">Reset</button>
          </div>

          <svg id="knowledge-graph" role="img" aria-label="Interactive knowledge graph of writeups and tags"></svg>

          <div class="graph-zoom-group">
            <button id="graph-zoom-in" class="graph-btn" type="button" aria-label="Zoom in">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
            <button id="graph-zoom-out" class="graph-btn" type="button" aria-label="Zoom out">
              <i class="bi bi-dash-lg" aria-hidden="true"></i>
            </button>
          </div>

          <div class="graph-legend" aria-hidden="true">
            <span><span class="legend-dot" style="background:#00d084;"></span>HTB</span>
            <span><span class="legend-dot" style="background:#4f9dff;"></span>CTF</span>
            <span><span class="legend-dot" style="background:#ff6b6b;"></span>Malware</span>
            <span><span class="legend-dot" style="background:#9aa3ab;"></span>Tag</span>
          </div>
        </div>

        <!-- Info panel -->
        <aside class="graph-panel" aria-live="polite" aria-label="Selected node details">
          <div id="graph-panel-body"></div>
        </aside>

      </div>

      <p class="text-muted small pb-5">
        <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
        This graph is generated in the browser from the same writeup data used on the
        <a href="writeups.html">Writeups</a> page — no server or database involved.
      </p>

    </div>
  </main>

  <div id="footer-placeholder"></div>

</body>
</html>
